name: Build ANDROMAT APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev ccache

      - name: Install buildozer + cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer==1.5.0

      - name: Pre-accept Android SDK licenses + sdkmanager shim
        run: |
          SDK=/home/runner/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/cmdline-tools $SDK/tools/bin
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          # buildozer legacy path expect karta hai (tools/bin/sdkmanager) -
          # naya Google SDK sirf cmdline-tools deta hai, isliye shim banate hain
          printf '#!/bin/bash\nexec %s/cmdline-tools/latest/bin/sdkmanager "$@"\n' "$SDK" > $SDK/tools/bin/sdkmanager
          chmod +x $SDK/tools/bin/sdkmanager
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo "SDK ready: licenses accepted + sdkmanager shim created"

      - name: Build APK (debug)
        run: |
          buildozer -v android debug
        env:
          BUILDOZER_BIN: /usr/local/bin/buildozer

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: andromat-chat-apk
          path: bin/*.apk
          if-no-files-found: error
